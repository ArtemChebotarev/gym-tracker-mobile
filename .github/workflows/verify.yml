name: Verify

on:
  # release/* — a fix for a version already out goes through a PR into its release branch
  # (README, "Releasing to TestFlight"), and is checked the same way as one into main.
  pull_request:
    branches: [main, hybrid, 'release/**']
  push:
    branches: [main, hybrid, 'release/**']
  workflow_dispatch: {}

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run verify
