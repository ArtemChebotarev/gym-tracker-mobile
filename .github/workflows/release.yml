name: Release

# Push of a tag vX.Y.Z → verify → EAS build (production profile) → upload to TestFlight.
# The "Run workflow" button does the same for the branch it is run on — main, or a release/X.Y
# branch — with the version from app.json (a rebuild after a failed run, or a fix without a
# version bump). How main and release branches split the work: README, "Releasing".
# Secrets live in GitHub (EXPO_TOKEN); the App Store Connect API key lives on EAS, not here.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch: {}

# Two releases must not build side by side; a running one is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: build and submit to TestFlight
    runs-on: ubuntu-latest
    # The EAS queue on the free plan can take a while; the job only waits for it.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A tag on a task branch would ship unreviewed code. Both main and release/* are reached
      # only through reviewed PRs, so a release commit must be on one of them — a tag on main
      # for the next version, on release/X.Y for a fix of a version already out. For the
      # button, the same rule: run it on main or on a release branch.
      - name: Release commit must be on main or a release branch
        run: |
          git fetch --quiet origin '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          for branch in $(git for-each-ref --format='%(refname:short)' \
            refs/remotes/origin/main 'refs/remotes/origin/release/*'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "Releasing $GITHUB_REF_NAME from $branch"
              exit 0
            fi
          done
          echo "::error::$GITHUB_REF_NAME is neither on main nor on a release/* branch"
          exit 1

      - name: Tag must match the version in app.json
        if: github.ref_type == 'tag'
        run: |
          app_version="$(node -p "require('./app.json').expo.version")"
          if [ "v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but app.json version is $app_version — bump it through a PR first"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Includes the migration stamps and catalog tests: a broken migration never reaches the phone.
      - run: npm run verify

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build on EAS and submit to TestFlight
        run: eas build --platform ios --profile production --non-interactive --auto-submit
